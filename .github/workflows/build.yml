name: build

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

# Superseded PR runs are cancelled; runs on main are never cancelled because
# they publish the image and open the deploy PR.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/cutwire-studios/cutwire-studio

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:dist

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json
      # packages.lock.json files are committed; a drifting dependency fails here.
      - run: dotnet restore --locked-mode
      # Embedded SPAs: Release builds embed web/dist when it exists; the tests
      # run in Debug and do not need it. Security analyzers (CA5xxx) are errors.
      - run: dotnet build -c Debug --no-restore
      # Integration tests start postgres:17-alpine via Testcontainers (Docker is
      # preinstalled on the runner).
      - run: dotnet test -c Debug --no-build

  image:
    needs: [web, backend]
    # PRs from forks can't push to the registry.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing of the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build locally first so a vulnerable image is never pushed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Fails on fixable HIGH/CRITICAL findings (OS packages, bundled libraries).
      # .trivyignore holds reviewed exceptions.
      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/work -w /work \
            ghcr.io/aquasecurity/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile .trivyignore "$IMAGE:scan"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # sbom: true attaches a BuildKit-generated SPDX SBOM to the image as an
      # OCI attestation (inspect with: docker buildx imagetools inspect --format '{{ json .SBOM }}').
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
      # Signed SLSA provenance, stored next to the image in GHCR.
      # Verify with: gh attestation verify oci://ghcr.io/cutwire-studios/cutwire-studio:<tag> -R cutwire-studios/cutwire-studio
      # Attestations need a public repo (or Enterprise Cloud); set the PUBLIC_REPO variable to true once public.
      - if: vars.PUBLIC_REPO == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Opens a PR on CutWire-Studio-Deploy that pins the new image; merging it
  # deploys (that repo's deploy workflow runs on the server's self-hosted runner).
  # Needs the cutwire-deploy-bot GitHub App installed on CutWire-Studio-Deploy
  # (Contents + Pull requests write): DEPLOY_APP_CLIENT_ID variable, DEPLOY_APP_PRIVATE_KEY secret.
  bump-deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: CutWire-Studios
          repositories: CutWire-Studio-Deploy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CutWire-Studios/CutWire-Studio-Deploy
          token: ${{ steps.app-token.outputs.token }}
      - name: Open a PR bumping the image pin
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.image.outputs.tag }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          if [ -z "$DIGEST" ]; then echo "Image digest missing"; exit 1; fi
          sed -i -E "s#(image: ghcr.io/cutwire-studios/cutwire-studio):[^[:space:]]+#\\1:${TAG}@${DIGEST}#" docker-compose.yml
          if git diff --quiet; then echo "Already on $TAG"; exit 0; fi
          branch="bump/cutwire-studio-$TAG"
          git config user.name "cutwire-deploy-bot[bot]"
          git config user.email "cutwire-deploy-bot[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore: deploy cutwire-studio:$TAG"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Deploy cutwire-studio:$TAG" \
            --body "Built from ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}. Merging deploys it."
