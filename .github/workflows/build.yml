name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/cutwire-studios/cutwire-studio

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:dist

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      # Embedded SPAs: Release builds embed web/dist when it exists; the tests
      # run in Debug and do not need it.
      - run: dotnet build -c Debug
      # Integration tests start postgres:17-alpine via Testcontainers (Docker is
      # preinstalled on the runner).
      - run: dotnet test -c Debug --no-build

  image:
    needs: [web, backend]
    # PRs from forks can't push to the registry.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dispatch-deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      # The body goes in on stdin because client_payload must arrive as a JSON object.
      - name: Trigger cutwire-ansible
        env:
          GH_TOKEN: ${{ secrets.ANSIBLE_DISPATCH_TOKEN }}
        run: |
          jq -nc \
            --arg tag "sha-$GITHUB_SHA" \
            '{event_type:"deploy-studio", client_payload:{image_tag:$tag}}' \
          | gh api --method POST repos/cutwire-studios/cutwire-ansible/dispatches --input -
